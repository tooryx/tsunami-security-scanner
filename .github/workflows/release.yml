name: Publish package to GitHub Packages
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'graalvm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build packages
        run: gradle shadowJar

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            common/build/libs/tsunami-common-*.jar
            plugin/build/libs/tsunami-plugin-*.jar
            proto/build/libs/tsunami-proto-*.jar
            main/build/libs/tsunami-main-*.jar
            proto/build/libs/tsunami-proto-*-sources.jar
            workflow/build/libs/tsunami-workflow-*.jar
